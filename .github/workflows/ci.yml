name: go-asteroids

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - '**' # Run for all pull requests

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Go environment
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23 # Matches your Go version (update as required)

      # Step 3: Cache Go modules
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: go mod tidy

      # Step 5: Run tests
      - name: Run Tests
        run: go test ./...

      # Step 6: Build the project
      - name: Build
        run: go build -o bin/your-app-name .

      # Optional Step: Upload Artifact (built binary)
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: your-app-name
          path: bin/your-app-name

